{% extends "base.html" %}

{% block title %}{{ status_code }} - InvoiceFlow{% endblock %}
{% block heading %}Something went wrong{% endblock %}

{% block content %}
<div class="mx-auto max-w-md rounded-xl border border-line bg-surface p-8 text-center shadow-card">
  <p class="text-4xl font-semibold tracking-tight text-ink">{{ status_code }}</p>
  <p class="mt-3 text-sm text-muted">{{ message }}</p>
  <a href="{{ url_for('web.dashboard') }}" class="btn btn--primary mt-6">
    Back to the dashboard
  </a>
</div>
{% endblock %}
