{% extends "base.html" %}

{% block title %}{{ status_code }} - InvoiceFlow{% endblock %}
{% block heading %}Something went wrong{% endblock %}

{% block content %}
<div class="mx-auto max-w-md rounded-xl border border-slate-200 bg-white p-8 text-center shadow-card">
  <p class="text-4xl font-semibold tracking-tight text-slate-900">{{ status_code }}</p>
  <p class="mt-3 text-sm text-slate-500">{{ message }}</p>
  <a href="{{ url_for('web.dashboard') }}"
     class="mt-6 inline-flex items-center rounded-lg bg-brand-600 px-3.5 py-2 text-sm font-medium text-white hover:bg-brand-700">
    Back to the dashboard
  </a>
</div>
{% endblock %}
